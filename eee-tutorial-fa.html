<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ژورنال EEE — راهنما</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#0a0a0e;color:#e0dcc8;font-family:'Vazirmatn',Tahoma,Arial,sans-serif;overflow:hidden;}

/* ── LANDING PAGE ── */
#landing{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;
  background:radial-gradient(ellipse at 50% 60%,#1a1600 0%,#0a0a0e 70%);
  padding:40px 28px;text-align:center;
}
.land-title{font-size:clamp(26px,6vw,38px);font-weight:800;letter-spacing:.01em;line-height:1.35;}
.land-title span{background:linear-gradient(110deg,#FFB800,#ff8c00,#ffd000);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.land-sub{font-size:15px;color:#6a6040;line-height:1.9;max-width:340px;}
.land-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.3);border-radius:20px;padding:7px 18px;font-size:12px;font-weight:700;color:#FFB800;letter-spacing:.04em;}
.land-arrow{font-size:13px;color:#44402a;margin-top:-12px;animation:bounce .8s ease-in-out infinite alternate;}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(6px)}}

/* ── ASSISTIVE TOUCH BUTTON ── */
@keyframes atGlow{
  0%,100%{filter:drop-shadow(0 0 4px rgba(255,184,0,.5)) drop-shadow(0 0 8px rgba(255,140,0,.25))}
  50%{filter:drop-shadow(0 0 10px rgba(255,184,0,1)) drop-shadow(0 0 20px rgba(255,140,0,.75)) drop-shadow(0 0 28px rgba(255,208,0,.5))}}
@keyframes atIconPulse{
  0%,100%{opacity:.85}
  50%{opacity:1}}
#tutAt{
  position:fixed;left:0;top:0;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(rgba(42,22,0,.92),rgba(42,22,0,.92)) padding-box,
             linear-gradient(135deg,#FFB800,#ff8c00,#ffd000,#FFB800) border-box;
  border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,220,120,1);font-size:22px;z-index:9600;cursor:grab;
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;
  will-change:transform;transition:opacity .25s;
  box-shadow:0 4px 22px rgba(0,0,0,.65);}
#tutAt.idle{opacity:.95;animation:atGlow 2.8s ease-in-out infinite;}
#tutAt.dragging{cursor:grabbing;transition:none;animation:none!important;
  background:linear-gradient(rgba(80,45,0,.96),rgba(80,45,0,.96)) padding-box,
             linear-gradient(135deg,#FFB800,#ff8c00,#ffd000,#FFB800) border-box;
  border:2.5px solid transparent;
  box-shadow:0 8px 30px rgba(0,0,0,.75);}
#tutAt.snapping{transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .25s;}
body.wit-on #tutAt{
  background:linear-gradient(rgba(60,35,0,.92),rgba(60,35,0,.92)) padding-box,
             linear-gradient(135deg,#FFB800,#ff8c00,#FFB800) border-box;
  border:2px solid transparent;
  box-shadow:0 4px 20px rgba(0,0,0,.6),0 0 0 5px rgba(255,184,0,.18),0 0 18px rgba(255,184,0,.25);}

/* ── TOUR PICKER SHEET ── */
.modal{
  position:fixed;inset:0;z-index:9700;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .22s;display:flex;align-items:flex-end;}
.modal.show{opacity:1;pointer-events:all;}
.sheet{
  width:100%;background:#100e00;border-radius:22px 22px 0 0;
  border-top:1px solid rgba(255,184,0,.1);
  max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.34,1.2,.64,1);}
.modal.show .sheet{transform:translateY(0);}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 12px;position:sticky;top:0;background:#100e00;z-index:1;
  border-bottom:1px solid rgba(255,184,0,.08);}
.sheet-title{font-size:16px;font-weight:800;color:#e8dfa0;letter-spacing:.01em;}
.sheet-x{
  width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,184,0,.1);
  color:#888;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;}
.tour-level-btn{
  width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid #2a2200;
  background:#0d0b00;font-size:14px;font-weight:700;cursor:pointer;
  margin-bottom:8px;text-align:right;display:flex;align-items:center;gap:12px;
  font-family:inherit;-webkit-tap-highlight-color:transparent;
  transition:transform .12s,border-color .15s;color:#e8dfc8;}
.tour-level-btn:active{transform:scale(.97);}
.tlb-name{flex:1;color:#e8dfc8;font-size:14px;text-align:right;}
.tlb-count{font-size:11px;color:#5a5030;font-weight:500;direction:ltr;}

/* ── WIT MODE ── */
#witTooltip{
  position:fixed;z-index:9999;max-width:260px;pointer-events:auto;cursor:pointer;
  background:rgba(18,12,0,.96);border:1.5px solid rgba(255,184,0,.55);
  border-radius:14px;padding:12px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 6px 28px rgba(0,0,0,.7);opacity:0;transition:opacity .18s;
  transform:translate(-50%,-100%) translateY(-12px);}
#witTooltip.show{opacity:1;}
#witTooltip .wit-title{font-size:13px;font-weight:700;color:#FFB800;margin-bottom:4px;line-height:1.3;}
#witTooltip .wit-body{font-size:12px;color:rgba(240,230,190,.88);line-height:1.65;}
#witTooltip .wit-tip{font-size:11px;color:rgba(255,184,0,.5);margin-top:6px;}
#witTooltip .wit-exit{display:block;margin-top:9px;background:none;border:1px solid rgba(255,184,0,.4);
  border-radius:7px;color:rgba(255,184,0,.65);font-size:11px;padding:5px 0;cursor:pointer;
  width:100%;text-align:center;-webkit-tap-highlight-color:transparent;font-family:inherit;}
#witTooltip.zoomed{max-width:min(320px,calc(100vw - 24px));padding:16px 18px;}
#witTooltip.zoomed .wit-title{font-size:18px;margin-bottom:8px;}
#witTooltip.zoomed .wit-body{font-size:16px;line-height:1.75;}
#witTooltip.zoomed .wit-exit{font-size:13px;padding:7px 0;}
.wit-target-ring{outline:2.5px solid rgba(255,184,0,.95)!important;outline-offset:4px;
  border-radius:7px;box-shadow:0 0 0 5px rgba(255,184,0,.18)!important;}

/* ── DEMO OVERLAY ── */
#demoOv{
  position:fixed;inset:0;z-index:9500;
  background:#050507;
  display:flex;flex-direction:column;align-items:center;
  opacity:0;pointer-events:none;
  transition:opacity .28s ease;
  padding:0 0 env(safe-area-inset-bottom,0px);
}
#demoOv.show{opacity:1;pointer-events:all;}

#demoHdr{
  width:100%;max-width:460px;
  display:flex;align-items:center;padding:16px 20px 10px;
  flex-shrink:0;
  /* keep header LTR so icon stays left, close button right */
  direction:ltr;
}
#demoIcon{font-size:22px;margin-right:10px;}
#demoTitle{font-size:17px;font-weight:700;color:#e8e8f0;flex:1;direction:rtl;text-align:right;padding-right:4px;}
#demoClose{
  width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(255,255,255,.07);color:#888;
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
#demoClose:hover{background:rgba(255,255,255,.13);color:#e0e0ee;}

/* Phone stage — always LTR (app is English) */
#phonePad{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:8px 0;min-height:0;
}
#phone{
  position:relative;
  width:234px;height:462px;
  background:#0d0d1e;
  border-radius:38px;
  border:7px solid #252540;
  box-shadow:0 24px 64px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.04);
  overflow:hidden;flex-shrink:0;
  direction:ltr;
}
.phone-notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:88px;height:24px;background:#1a1a30;border-radius:0 0 16px 16px;z-index:20;
}
.phone-home{
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
  width:80px;height:4px;background:rgba(255,255,255,.22);border-radius:2px;z-index:20;
}
#screen{
  position:absolute;inset:0;overflow:hidden;direction:ltr;
}

/* Cursor */
#cursor{
  position:absolute;width:36px;height:36px;z-index:100;
  pointer-events:none;top:200px;left:99px;
  transition:top .5s cubic-bezier(.25,.46,.45,.94),left .5s cubic-bezier(.25,.46,.45,.94);
}
.cursor-inner{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,184,0,.75);border:2px solid rgba(255,184,0,.95);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:0 2px 12px rgba(255,184,0,.4);
}
#cursor.tap .cursor-inner{animation:cTap .35s ease-out;}
@keyframes cTap{
  0%{transform:scale(1);}30%{transform:scale(.78);}60%{transform:scale(1.15);}100%{transform:scale(1);}
}

/* Tap ring */
.tap-ring{
  position:absolute;width:36px;height:36px;border-radius:50%;
  border:2px solid rgba(255,184,0,.7);pointer-events:none;z-index:99;
  animation:ringOut .55s ease-out forwards;
}
@keyframes ringOut{
  from{transform:scale(.8);opacity:.8;}
  to{transform:scale(2.4);opacity:0;}
}

/* Caption & nav */
#capWrap{
  width:100%;max-width:460px;flex-shrink:0;
  padding:6px 24px 10px;text-align:center;
}
#caption{
  font-size:14px;color:#7070508;line-height:1.8;min-height:38px;
  transition:opacity .3s;color:#7a7050;
}
#caption strong{color:#c8b870;}

#navRow{
  width:100%;max-width:460px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px 20px;
  /* LTR for arrows so ◀ is visually left, ▶ right */
  direction:ltr;
}
.nav-arr{
  width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,184,0,.15);
  background:rgba(255,184,0,.04);color:#706040;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s,border-color .15s;
}
.nav-arr:hover{background:rgba(255,184,0,.1);color:#d0a840;border-color:rgba(255,184,0,.3);}
#dots{display:flex;gap:6px;align-items:center;}
.dot{
  width:6px;height:6px;border-radius:3px;background:#2a2200;
  transition:background .25s,width .25s;cursor:pointer;
}
.dot.active{background:linear-gradient(110deg,#FFB800,#ff8c00);width:20px;}

/* ── PHONE SCREEN CONTENT STYLES (LTR, English app) ── */
.s-hdr{
  height:52px;background:#16162a;border-bottom:1px solid #2a2a45;
  display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;
}
.s-brand{font-family:Georgia,serif;font-size:16px;color:#f59e0b;}
.s-btick{font-size:10px;color:#505070;margin-left:auto;}

.s-lbl{font-size:9px;color:#5a5a80;text-transform:uppercase;letter-spacing:.08em;padding:10px 12px 5px;font-weight:700;}

/* Emotion list */
.s-emo-wrap{overflow:hidden;flex:1;}
.s-emo-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-bottom:1px solid #1a1a28;cursor:pointer;
  transition:background .15s;
}
.s-emo-item.sel{background:#1e1e35;}
.s-emo-n{width:20px;font-size:12px;font-weight:700;flex-shrink:0;text-align:right;}
.s-emo-sw{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.s-emo-txt{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Log button */
.s-log-btn{
  margin:10px 12px;padding:10px;border:none;border-radius:8px;
  background:#f59e0b;color:#000;font-weight:700;font-size:12px;
  cursor:pointer;transition:opacity .15s;width:calc(100% - 24px);
}
.s-log-btn.pressed{opacity:.7;}

/* Section F strip */
.s-fstrip{display:flex;height:36px;border-radius:5px;overflow:visible;outline:1.5px solid rgba(245,158,11,.28);outline-offset:2px;margin:8px 12px;}
.s-fslot{
  flex:1;height:36px;border-radius:3px;margin:0 1px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  cursor:pointer;border:1px solid transparent;transition:background .25s;font-size:8px;
}
.s-fslot.filled{border:1px solid rgba(34,204,85,.4);}
.s-fslot .fn{font-size:10px;font-weight:700;color:rgba(255,255,255,.9);}
.s-fslot .ft{font-size:7px;color:rgba(255,255,255,.6);}

/* Quality picker sheet */
.s-qpicker{
  position:absolute;bottom:0;left:0;right:0;
  background:#16162a;border-radius:14px 14px 0 0;
  border-top:1px solid #2a2a45;
  padding:6px 0 12px;z-index:50;
  transform:translateY(100%);transition:transform .3s ease;
}
.s-qpicker.up{transform:translateY(0);}
.s-qpicker-handle{width:32px;height:4px;background:#2a2a45;border-radius:2px;margin:0 auto 8px;}
.s-qitem{
  display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;
}
.s-qitem.sel-q{background:#1e1e35;}
.s-qdot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.s-qtxt{font-size:12px;}

/* Chart area */
.s-chart-area{flex:1;position:relative;padding:8px 0;}
.chart-svg{width:100%;height:100%;}

/* Timeline entries */
.s-tl-day{font-size:9px;color:#5a5a80;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px 4px;border-bottom:1px solid #1e1e2e;}
.s-tl-row{
  display:flex;align-items:stretch;padding:7px 10px;
  border-bottom:1px solid #181828;
  opacity:0;transform:translateX(16px);
  transition:opacity .35s,transform .35s;
}
.s-tl-row.in{opacity:1;transform:translateX(0);}
.s-tl-strip{width:4px;border-radius:3px;flex-shrink:0;margin-right:8px;min-height:28px;}
.s-tl-body{flex:1;min-width:0;}
.s-tl-time{font-size:9px;color:#5a5a80;margin-bottom:2px;}
.s-tl-main{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.s-tl-qdot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-left:6px;}

/* Calendar */
.s-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 10px;}
.s-cal-dow{font-size:7px;color:#5a5a80;text-align:center;padding:2px 0;}
.s-cal-cell{
  aspect-ratio:1;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:8px;color:rgba(255,255,255,.4);
  opacity:0;transition:opacity .3s;cursor:pointer;
  position:relative;
}
.s-cal-cell.shown{opacity:1;}
.s-cal-cell.today::after{content:'';position:absolute;top:2px;left:2px;width:4px;height:4px;border-radius:50%;background:#f59e0b;}
.s-cal-detail{
  margin:8px 10px 0;background:#16162a;border:1px solid #2a2a45;border-radius:8px;padding:10px 12px;
  opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;
}
.s-cal-detail.show{opacity:1;transform:translateY(0);}

/* Patterns month grid */
.s-pat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 10px;}
.s-month-block{
  background:#1e1e35;border:1px solid #2a2a45;border-radius:7px;overflow:hidden;
  cursor:pointer;opacity:0;transform:scale(.92);transition:opacity .3s,transform .3s,border-color .15s;
}
.s-month-block.shown{opacity:1;transform:scale(1);}
.s-month-block:hover{border-color:rgba(245,158,11,.5);}
.s-mb-top{padding:5px 7px 3px;font-size:10px;font-weight:600;color:#d0d0e8;}
.s-mb-cnt{font-size:8px;color:#5a5a80;}
.s-mb-emo{height:9px;margin:0 6px 2px;border-radius:2px 2px 0 0;}
.s-mb-exp{height:5px;margin:0 6px 6px;border-radius:0 0 2px 2px;}

/* Day arc overlay (inside phone) */
.s-day-ov{
  position:absolute;inset:0;background:#0d0d1e;z-index:40;
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s ease;
}
.s-day-ov.in{transform:translateX(0);}
.s-day-back{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:11px;color:#7878a0;cursor:pointer;flex-shrink:0;}

/* Month view overlay */
.s-month-ov{
  position:absolute;inset:0;background:#0d0d1e;z-index:40;
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s ease;
}
.s-month-ov.in{transform:translateX(0);}

/* Success flash */
.s-success{
  position:absolute;inset:0;background:rgba(0,255,136,.07);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;z-index:80;
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.s-success.show{opacity:1;}
.s-success-icon{font-size:40px;}
.s-success-txt{font-size:13px;color:#00FF88;font-weight:600;}

/* Arc SVG dots and line */
@keyframes dotPop{from{r:0;opacity:0;}to{opacity:1;}}
@keyframes drawLine{from{stroke-dashoffset:300;}to{stroke-dashoffset:0;}}
</style>
</head>
<body>

<!-- Landing -->
<div id="landing">
  <div class="land-badge">✨ راهنمای تعاملی</div>
  <div class="land-title">چگونه از<br><span>EEE Journal</span><br>استفاده کنیم</div>
  <div class="land-sub">شش نمایش انیمیشنی — دقیقاً ببینید هر بخش از ژورنال چه کار می‌کند، بدون نیاز به مطالعه.</div>
  <div class="land-arrow">↓ دکمه زیر را لمس کنید تا شروع شود</div>
</div>

<!-- Floating AT button — iOS-grade draggable, gold border -->
<div id="tutAt">✦</div>

<!-- Tour Picker Sheet -->
<div class="modal" id="tourPickerSheet"
  onclick="if(event.target===this)closeTourPicker()"
  ontouchend="if(event.target===this){event.preventDefault();closeTourPicker();}">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">ژورنال EEE — نمایش‌ها</div>
      <button class="sheet-x" onclick="closeTourPicker()">✕</button>
    </div>
    <div style="padding:14px 16px 28px;">
      <button class="tour-level-btn" style="border-color:rgba(167,139,250,.28)" onclick="closeTourPicker();openDemo(0)">
        <span style="font-size:20px;">💜</span>
        <span class="tlb-name">ثبت یک احساس</span>
        <span class="tlb-count">demo 1 of 6</span>
      </button>
      <button class="tour-level-btn" style="border-color:rgba(245,158,11,.28)" onclick="closeTourPicker();openDemo(1)">
        <span style="font-size:20px;">🟡</span>
        <span class="tlb-name">بخش F — کیفیت دوساعته</span>
        <span class="tlb-count">demo 2 of 6</span>
      </button>
      <button class="tour-level-btn" style="border-color:rgba(103,232,249,.28)" onclick="closeTourPicker();openDemo(2)">
        <span style="font-size:20px;">🌊</span>
        <span class="tlb-name">قوس امروز</span>
        <span class="tlb-count">demo 3 of 6</span>
      </button>
      <button class="tour-level-btn" style="border-color:rgba(148,163,184,.2)" onclick="closeTourPicker();openDemo(3)">
        <span style="font-size:20px;">📜</span>
        <span class="tlb-name">خط زمانی — همه ورودی‌ها</span>
        <span class="tlb-count">demo 4 of 6</span>
      </button>
      <button class="tour-level-btn" style="border-color:rgba(34,197,94,.2)" onclick="closeTourPicker();openDemo(4)">
        <span style="font-size:20px;">📅</span>
        <span class="tlb-name">تاریخچه — نمای تقویم</span>
        <span class="tlb-count">demo 5 of 6</span>
      </button>
      <button class="tour-level-btn" style="border-color:rgba(245,168,255,.2)" onclick="closeTourPicker();openDemo(5)">
        <span style="font-size:20px;">🔮</span>
        <span class="tlb-name">الگوها — سال · ماه · روز</span>
        <span class="tlb-count">demo 6 of 6</span>
      </button>
      <button class="tour-level-btn" style="border-color:rgba(255,184,0,.38);margin-top:6px" onclick="closeTourPicker();activateWIT()">

function closeDemo() {

function buildDots() {
  const el = document.getElementById('dots');
  el.innerHTML = DEMOS.map((_, i) =>
    `<div class="dot${i===curDemo?' active':''}" onclick="shiftDemo(${i-curDemo})"></div>`
  ).join('');
}

function shiftDemo(dir) {
  clearAllTimers();
  curDemo = (curDemo + dir + DEMOS.length) % DEMOS.length;
  buildDots();
  runDemo(curDemo);
}

function runDemo(idx) {
  const d = DEMOS[idx];

// ════════════════════════════════════════════
// CURSOR HELPERS
// ════════════════════════════════════════════
const cursor = document.getElementById('cursor');

function setCursor(x, y, animate=true) {
  cursor.style.transition = animate
    ? 'top .5s cubic-bezier(.25,.46,.45,.94),left .5s cubic-bezier(.25,.46,.45,.94)'
    : 'none';
  cursor.style.top  = y + 'px';
  cursor.style.left = x + 'px';
}

function tap(x, y) {
  setCursor(x, y);
  return delay(550, () => {
    cursor.classList.remove('tap');
    void cursor.offsetWidth;
    cursor.classList.add('tap');
    const ring = document.createElement('div');
    ring.className = 'tap-ring';
    ring.style.top  = y + 'px';
    ring.style.left = x + 'px';
    cursor.parentNode.appendChild(ring);
    setTimeout(() => ring.remove(), 600);
  });
}

// ════════════════════════════════════════════
// TIMER HELPERS
// ════════════════════════════════════════════
function delay(ms, fn) {
  const t = setTimeout(fn, ms);
  timers.push(t);
  return ms;
}

function seq(steps) {
  steps.forEach(([ms, fn]) => {
    const t = setTimeout(fn, ms);
    timers.push(t);
  });
}

function clearAllTimers() {
  timers.forEach(t => clearTimeout(t));
  timers = [];
  if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
}

function scheduleLoop(fn, ms) {
  loopTimer = setTimeout(fn, ms);
  timers.push(loopTimer);
}

function setCaption(html) {
  const el = document.getElementById('caption');
  el.style.opacity = '0';
  setTimeout(() => { el.innerHTML = html; el.style.opacity = '1'; }, 200);
  const t = setTimeout(() => {}, 0);
  timers.push(t);
}

// iOS-GRADE AT BUTTON DRAG (gold, FA version)
// ════════════════════════════════════════════
(function(){
  var el, tx=0, ty=0;
  var PAD=22, SIZE=52;
  var active=false, moved=false, tid=-1;
  var startCX=0, startCY=0, startTX=0, startTY=0;
  var rafId=null, pendX=0, pendY=0;

  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function savePos(x,y){try{localStorage.setItem('eee_tutAt_fa',JSON.stringify({x:x,y:y}));}catch(e){}}
  function loadPos(){try{var p=JSON.parse(localStorage.getItem('eee_tutAt_fa'));if(p)return p;}catch(e){}return null;}
  function applyXY(x,y){tx=x;ty=y;el.style.transform='translate3d('+x+'px,'+y+'px,0)';}
  function snapEdge(x,y){
    var vw=window.innerWidth,vh=window.innerHeight;
    var zone=vw*0.28;
    var snappedX=x<=zone?PAD:(x>=vw-SIZE-zone?vw-SIZE-PAD:x);
    return{x:snappedX,y:clamp(y,PAD,vh-SIZE-PAD)};
  }
  function getTouch(list,id){
    for(var i=0;i<list.length;i++)if(list[i].identifier===id)return list[i];
    return null;
  }
  function onTS(e){
    if(active){
      active=false;tid=-1;
      if(rafId){cancelAnimationFrame(rafId);rafId=null;}
      if(el){el.classList.remove('dragging','snapping');el.classList.add('idle');}
    }
    e.preventDefault();
    if(!e.changedTouches||!e.changedTouches[0])return;
    var t=e.changedTouches[0];
    tid=t.identifier;active=true;moved=false;
    startCX=t.clientX;startCY=t.clientY;
    startTX=tx;startTY=ty;
    el.classList.add('dragging');
    el.classList.remove('idle','snapping');
  }
  function onTM(e){
    if(!active)return;
    e.preventDefault();
    var t=getTouch(e.changedTouches,tid);if(!t)return;
    var dx=t.clientX-startCX,dy=t.clientY-startCY;
    if(!moved&&(Math.abs(dx)>6||Math.abs(dy)>6))moved=true;
    pendX=clamp(startTX+dx,PAD,window.innerWidth-SIZE-PAD);
    pendY=clamp(startTY+dy,PAD,window.innerHeight-SIZE-PAD);
    if(!rafId)rafId=requestAnimationFrame(commit);
  }
  function commit(){rafId=null;applyXY(pendX,pendY);}
  function onTE(e){
    if(!active)return;
    var t=getTouch(e.changedTouches,tid);if(!t)return;
    active=false;tid=-1;
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    el.classList.remove('dragging');
    if(!moved){
      openTourPicker();
      setTimeout(function(){el.classList.add('idle');},500);
      return;
    }
    var s=snapEdge(tx,ty);
    el.classList.add('snapping');
    applyXY(s.x,s.y);
    savePos(s.x,s.y);
    setTimeout(function(){el.classList.remove('snapping');el.classList.add('idle');},380);
  }
  function onTC(){
    if(!active)return;
    active=false;tid=-1;
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    if(el){
      el.classList.remove('dragging');
      var s=snapEdge(tx,ty);
      el.classList.add('snapping');
      applyXY(s.x,s.y);
      savePos(s.x,s.y);
      setTimeout(function(){el.classList.remove('snapping');el.classList.add('idle');},380);
    }
  }
  window._eeeAt_resetState=function(){
    active=false;tid=-1;
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    if(el){el.classList.remove('dragging','snapping');el.classList.add('idle');}
  };

  document.addEventListener('DOMContentLoaded',function(){
    el=document.getElementById('tutAt');
    if(!el)return;
    var saved=loadPos();
    var vw=window.innerWidth,vh=(window.visualViewport?window.visualViewport.height:window.innerHeight);
    var initX=saved?saved.x:vw-SIZE-PAD;
    var initY=saved?saved.y:vh-SIZE-110;
    applyXY(initX,initY);
    setTimeout(function(){el.classList.add('idle');},1200);
    el.addEventListener('touchstart',onTS,{passive:false});
    el.addEventListener('touchmove',onTM,{passive:false});
    el.addEventListener('touchend',onTE,{passive:false});
    el.addEventListener('touchcancel',onTC,{passive:true});
    el.addEventListener('click',function(){if(!moved)openTourPicker();});
  });
})();

    {sel:'#phone,#phonePad',  title:'پیش‌نمایش گوشی',     body:'یک شبیه‌سازی انیمیشنی از اپلیکیشن EEE Journal در حال اجرا روی آیفون. مکان‌نما را تماشا کنید که رابط واقعی را لمس می‌کند — این دقیقاً نحوه کار آن در دستگاه شما است.'},
    {sel:'#screen',           title:'شبیه‌سازی اپ',        body:'انیمیشن زنده رابط ژورنال. هر ضربه، اسلاید و هایلایت جریان دقیق تعامل این ویژگی را نشان می‌دهد — بدون نیاز به مطالعه.'},
    {sel:'#caption,#capWrap', title:'توضیحات',             body:'توصیف می‌کند که در انیمیشن چه اتفاقی می‌افتد. در هر مرحله کلیدی به‌روز می‌شود تا همیشه بدانید چه اتفاقی می‌افتد.'},
    {sel:'.nav-arr',          title:'پیکان ناوبری',        body:'به نمایش قبلی یا بعدی بروید. در مجموع ۶ نمایش وجود دارد که به صورت پیوسته حلقه می‌زنند.'},
    {sel:'#dots,.dot',        title:'نقاط پیشرفت نمایش',  body:'یک نقطه برای هر نمایش — در مجموع ۶ نقطه. نمایش فعال به شکل یک خط کوتاه‌تر نشان داده می‌شود. روی هر نقطه ضربه بزنید تا مستقیم به آن نمایش بروید.'},
    {sel:'#navRow',           title:'نوار ناوبری',         body:'با استفاده از پیکان‌ها یا نقاط بین نمایش‌ها جابجا شوید. نمایش به صورت خودکار حلقه می‌زند — می‌توانید اجازه دهید اجرا شود یا به هر جایی بروید.'},
    {sel:'#demoOv',           title:'صفحه نمایش',         body:'پخش‌کننده نمایش تمام‌صفحه. از دکمه ✦ (همیشه قابل مشاهده) برای باز کردن منو و انتخاب نمایش دیگری استفاده کنید، یا ✕ را برای بستن فشار دهید.'},
    {sel:'#demoHdr',          title:'هدر نمایش',           body:'نام و آیکون نمایش فعلی را نشان می‌دهد. دکمه ✕ در سمت راست نمایش را می‌بندد.'},
  ];

  var witActive=false;
  var witTipEl,witTitleEl,witBodyEl,witTipTimeout;

  function getWitEl(){
    if(!witTipEl){
      witTipEl=document.getElementById('witTooltip');
      witTitleEl=document.getElementById('witTitle');
      witBodyEl=document.getElementById('witBody');
    }
  }

  function hideWITTip(){
    getWitEl();
    if(witTipEl)witTipEl.classList.remove('show','zoomed');
    document.querySelectorAll('.wit-target-ring').forEach(function(n){n.classList.remove('wit-target-ring');});
  }

  window.deactivateWIT=function(){
    clearTimeout(witTipTimeout);
    witActive=false;
    document.body.classList.remove('wit-on');
    var at=document.getElementById('tutAt');
    if(at)at.textContent='✦';
    document.removeEventListener('touchend',witIntercept,{capture:true,passive:false});
    document.removeEventListener('click',witIntercept,true);
    document.removeEventListener('touchcancel',window.deactivateWIT,{capture:true,passive:true});
    hideWITTip();
    if(typeof window._eeeAt_resetState==='function')window._eeeAt_resetState();
  };

  window.activateWIT=function(){
    if(witActive)return;
    witActive=true;
    document.body.classList.add('wit-on');
    var at=document.getElementById('tutAt');
    if(at)at.textContent='❓';
    document.addEventListener('touchend',witIntercept,{capture:true,passive:false});
    document.addEventListener('click',witIntercept,true);
    document.addEventListener('touchcancel',window.deactivateWIT,{capture:true,passive:true});
    clearTimeout(witTipTimeout);
    witTipTimeout=setTimeout(window.deactivateWIT,10000);
  };

  function witIntercept(e){
    var target=e.target;
    var at=document.getElementById('tutAt');
    if(at&&(at===target||at.contains(target))){
      e.preventDefault();e.stopPropagation();
      window.deactivateWIT();
      if(typeof window._eeeAt_resetState==='function')window._eeeAt_resetState();
      setTimeout(function(){openTourPicker();},120);
      return;
    }
    getWitEl();
    if(witTipEl&&(witTipEl===target||witTipEl.contains(target))){
      e.preventDefault();e.stopPropagation();
      var isExit=target.classList&&target.classList.contains('wit-exit')||
                 (target.closest&&target.closest('.wit-exit'));
      if(isExit||witTipEl.classList.contains('zoomed')){
        window.deactivateWIT();
      } else {
        witTipEl.classList.add('zoomed');
        clearTimeout(witTipTimeout);
        witTipTimeout=setTimeout(window.deactivateWIT,15000);
      }
      return;
    }
    var match=null,node=target;
    while(node&&node!==document.body){
      for(var i=0;i<WIT_MAP.length;i++){
        try{if(node.matches(WIT_MAP[i].sel)){match=WIT_MAP[i];break;}}catch(err){}
      }
      if(match)break;
      node=node.parentElement;
    }
    if(!match){hideWITTip();return;}
    e.preventDefault();e.stopPropagation();
    document.querySelectorAll('.wit-target-ring').forEach(function(n){n.classList.remove('wit-target-ring');});
    node.classList.add('wit-target-ring');
    showWITTip(match.title,match.body,node);
    clearTimeout(witTipTimeout);
    witTipTimeout=setTimeout(window.deactivateWIT,10000);
  }

  function showWITTip(title,body,targetEl){
    getWitEl();if(!witTipEl)return;
    witTitleEl.textContent=title;
    witBodyEl.textContent=body;
    witTipEl.classList.remove('zoomed','show');
    var vw=window.innerWidth,vh=window.innerHeight;
    var rect=targetEl.getBoundingClientRect();
    var cx=rect.left+rect.width/2;
    var tipW=Math.min(260,vw-28);
    witTipEl.style.maxWidth=tipW+'px';
    var above=rect.top>200;
    if(above){
      witTipEl.style.top=(rect.top-12)+'px';
      witTipEl.style.transform='translate(-50%,-100%) translateY(-12px)';
    } else {
      witTipEl.style.top=(rect.bottom+12)+'px';
      witTipEl.style.transform='translate(-50%,0)';
    }
    var clampedX=Math.max(tipW/2+8,Math.min(vw-tipW/2-8,cx));
    witTipEl.style.left=clampedX+'px';
    requestAnimationFrame(function(){witTipEl.classList.add('show');});
  }
})();
</script>
</body>
</html>
